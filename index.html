<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷编程课堂记录与反馈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #ffffff;
            padding: 20px;
        }
        .container {
            width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            position: relative;
        }

        .img-top-right {
            position: absolute;
            top: 20px;
            right: 10px;
            width: 150px;
            height: auto;
            z-index: 1;
        }
        .img-top-left {
            position: absolute;
            top: 0px;
            left: 10px;
            width: 140px;
            height: auto;
            z-index: 1;
        }
        .img-bottom-right {
            position: absolute;
            bottom: 0px;
            right: 10px;
            width: 170px;
            height: auto;
            z-index: 1;
        }
        .img-bottom-left {
            position: absolute;
            bottom: 635px;
            left: 540px;
            width: 360px;
            height: auto;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #194b94;
            font-size: 42px;
        }
        .header p {
            color: #ff635;
            margin-top: 6px;
            font-size: 14px;
        }
        .two-col-layout {
            display: flex;
            gap: 25px;
        }
        .col-left, .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .card.blue {
            background-color: #f0f5ff;
            border: 2px solid #4078c0;
        }
        .card.green {
            background-color: #f0fff0;
            border: 2px solid #6baa75;
        }
        .card.orange {
            background-color: #fff8e6;
            border: 2px solid #ffb347;
        }
        .card.purple {
            background-color: #f8f0ff;
            border: 2px solid #9966cc;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #9966cc;
            font-size: 15px;
        }
        .form-row {
            margin-bottom: 10px;
            font-size: 14px;
        }
        .form-row input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 4px;
        }
        .comment-select-row{
            display:flex;
            gap:10px;
            margin-bottom:10px;
        }
        .comment-select-row select{
            flex:1;
        }
        .ability-table {
            width: 100%;
            border-collapse: collapse;
        }
        .ability-table th,.ability-table td {
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 13px;
            text-align: center;
        }
        .ability-table th {
            background: #e6f5e6;
        }
        .ability-type-select {
            width: 100%;
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .star-display {
            color: #ffcc00;
            font-size: 14px;
        }
        .star-input {
            width: 35px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .upload-area {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            user-select: none;
        }
        .upload-area input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -1;
            overflow: hidden;
        }
        .upload-btn {
            padding: 6px 12px;
            background: #4299e1;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 2;
        }

        .upload-image {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            cursor: grab;
            display: none;
        }

        .progress-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .progress-row label {
            width: 120px;
        }
        .progress-bar-container {
            flex: 1;
            height: 18px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 8px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4299e1;
        }
        .progress-percent input {
            width: 50px;
            border: 1px solid #ccc;
            padding: 2px;
            text-align: right;
        }
        .full-card-wrap {
            margin-top: 25px;
        }
        .full-card {
            width: 100%;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #4078c0;
        }
        .btn-group {
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            padding: 8px 18px;
            background-color: #367be8;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 6px;
        }
    </style>
</head>
<body>
<div class="container" id="report-container">
    <img class="img-top-right" src="图片1.png" alt="右上">
    <img class="img-top-left" src="电脑.png" alt="左上">
    <img class="img-bottom-right" src="jq.png" alt="右下">
    <img class="img-bottom-left" src="jj.png" alt="左下">

    <div class="header">
        <h1>酷编程课堂记录与反馈</h1>
        <p>记录成长每一步 · 见证进步每一天</p>
    </div>

    <div class="two-col-layout">
        <div class="col-left">
            <div class="card blue" style="height:300px">
                <h3>① 学生基本信息</h3>
                <div class="form-row"><label>学生姓名：</label><input type="text" id="stuName"></div>
                <div class="form-row"><label>课程名称：</label><input type="text" id="courseName"></div>
                <div class="form-row"><label>上课时间：</label><input type="datetime-local" id="classTime"></div>
                <div class="form-row"><label>教师姓名：</label><input type="text" id="teaName"></div>
            </div>
            <div class="card blue" style="height:270px">
                <h3>② 本节课学习内容</h3>
                <div class="form-row"><label>搭建主题：</label><input type="text" id="buildTheme"></div>
                <div class="form-row"><label>核心知识点：</label><input type="text" id="coreKnow"></div>
                <div class="form-row"><label>认知目标：</label><input type="text" id="cogTarget"></div>
            </div>
            <div class="card green" style="height:360px">
                <h3>③ 学习目标达成情况</h3>
                <table class="ability-table">
                    <thead><tr><th>能力类型</th><th>分析解释</th><th>达成星数</th></tr></thead>
                    <tbody id="abilityTable"></tbody>
                </table>
            </div>
            <div class="card blue" style="height:110px">
                <h3>④ 课堂练习完成分数</h3>
                <div class="form-row"><label>本节课得分：</label><input type="number" id="classScore" value="100" min="0" max="100"></div>
            </div>
        </div>

        <div class="col-right">
            <div class="card orange" style="height:460px">
                <h3>⑤ 本节课专注学习瞬间</h3>
                <div class="upload-area">
                    <input type="file" id="momentImg" accept="image/*">
                    <label class="upload-btn" for="momentImg">上传照片</label>
                    <img class="upload-image" id="momentPreview">
                </div>
            </div>
            <div class="card purple" style="height:250px">
                <h3>⑥ 课堂表现评估</h3>
                <div class="progress-row"><label>百科知识理解：</label><div class="progress-bar-container"><div class="progress-bar-fill" id="bkBar" style="width:80%"></div></div><div class="progress-percent"><input type="number" id="bkPercent" value="80"></div></div>
                <div class="progress-row"><label>搭建独立完成度：</label><div class="progress-bar-container"><div class="progress-bar-fill" id="buildBar" style="width:80%"></div></div><div class="progress-percent"><input type="number" id="buildPercent" value="80"></div></div>
                <div class="progress-row"><label>编程独立完成度：</label><div class="progress-bar-container"><div class="progress-bar-fill" id="codeBar" style="width:80%"></div></div><div class="progress-percent"><input type="number" id="codePercent" value="80"></div></div>
            </div>
            <div class="card orange" style="height:350px">
                <h3>⑦ 作品展示</h3>
                <div class="upload-area">
                    <input type="file" id="workImg" accept="image/*">
                    <label class="upload-btn" for="workImg">上传作品</label>
                    <img class="upload-image" id="workPreview">
                </div>
            </div>
        </div>
    </div>

    <div class="full-card-wrap">
        <div class="card purple full-card" style="height:160px">
            <h3>⑧ 教师寄语：</h3>
            <div class="comment-select-row">
                <select id="commentType">
                    <option value="">选择评语等级</option>
                    <option value="excellent">优秀表现</option>
                    <option value="normal">中等平稳</option>
                    <option value="weak">有待提升</option>
                </select>
                <select id="commentList"><option value="">先选择等级</option></select>
            </div>
            <textarea id="teacherMsg" rows="3" style="width:100%;border:1px solid #ccc;border-radius:4px;padding:5px"></textarea>
        </div>
    </div>

    <div class="footer-text">感谢信任支持，陪伴孩子快乐成长</div>
</div>

<div class="btn-group">
    <button class="btn" onclick="generateReport()">生成图片报告</button>
    <button class="btn" onclick="clearAll()">清空表单</button>
</div>

<!-- 正确引入 html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// 图片缩放 + 始终居中 + 等比例
function initImageResize(imgId) {
    const img = document.getElementById(imgId);
    let scale = 1;
    img.onwheel = function (e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.05 : 0.05;
        scale = Math.max(0.2, Math.min(5, scale + delta));
        img.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
}

// 评语系统
const commentLib = {
    excellent:["上课专注投入，理解能力出众，课堂任务总能高效完成。","逻辑思维极强，思路清晰，自主创作能力十分突出。","创意丰富独特，作品设计新颖亮眼。","遇事沉稳冷静，可独立排查问题，实操能力优秀。","积极参与课堂互动，乐于分享自信大方。"],
    normal:["课堂态度端正，认真听讲，按时完成基础任务。","具备基础逻辑思维，复杂内容需稍加引导。","学习态度踏实稳重，心态端正。","稳步吸收知识，长期坚持即可稳步提升。"],
    weak:["课堂专注力不足，听课效率偏低。","逻辑思维偏弱，梳理流程速度较慢。","动手熟练度不足，独立完成难度较大。","遇难题易退缩，依赖性较强。"]
};
const abilityList = ["编程能力","分析能力","整合能力","独立解决问题能力","逻辑思维能力","想象力和创造力","专注力","语言表达能力","记忆力理解力","抗挫能力","耐心细心","+ 新建能力"];
const abilityDesc = {"编程能力":"按要求完成编程解题","分析能力":"理清变量之间关系","整合能力":"结合实际问题编写程序","独立解决问题能力":"自主思考解决难题","逻辑思维能力":"思维清晰有条理","想象力和创造力":"拥有自主创作思路","专注力":"上课认真专注完成作品","语言表达能力":"表达清晰流畅易懂","记忆力理解力":"熟记知识并灵活运用","抗挫能力":"直面困难心态积极","耐心细心":"做事认真善于检查"};

let typeSel = document.getElementById("commentType");
let listSel = document.getElementById("commentList");
let msgArea = document.getElementById("teacherMsg");
typeSel.onchange = function(){
    let k = this.value;
    listSel.innerHTML = '<option value="">请选择评语</option>';
    if(!k)return;
    commentLib[k].forEach(t=>{let o=document.createElement("option");o.value=t;o.innerText=t;listSel.appendChild(o);});
};
listSel.onchange = function(){if(this.value)msgArea.value=this.value;};

// 能力表格
const tableBody = document.getElementById("abilityTable");
for(let i=0;i<5;i++){
    let tr=document.createElement("tr");
    tr.innerHTML=`<td><select class="ability-type-select">${abilityList.map(x=>`<option>${x}</option>`).join("")}</select></td><td class="abilityDesc">请选择能力</td><td><input class="star-input" type="number" value="3" min="1" max="5"><div class="star-display">★★★☆☆</div></td>`;
    tableBody.appendChild(tr);
}
document.querySelectorAll(".ability-type-select").forEach((s,i)=>{
    s.onchange=()=>{
        let v=s.value;
        if(v=="+ 新建能力"){
            let n=prompt("输入能力名称");if(!n)return;
            let d=prompt("输入能力说明");if(!d)return;
            abilityDesc[n]=d;s.options[s.length-1].text=n;s.value=n;
            document.querySelectorAll(".abilityDesc")[i].innerText=d;
        }else{
            document.querySelectorAll(".abilityDesc")[i].innerText=abilityDesc[v]||"暂无说明";
        }
    };
});
document.querySelectorAll(".star-input").forEach((inp,idx)=>{
    function up(){let n=Math.max(1,Math.min(5,parseInt(inp.value)||1));inp.value=n;document.querySelectorAll(".star-display")[idx].innerText="★".repeat(n)+"☆".repeat(5-n);}
    inp.oninput=up;up();
});

// 上传预览
document.getElementById("momentImg").onchange = e => {
    let f = e.target.files[0]; if (!f) return;
    let r = new FileReader();
    r.onload = ev => {
        let img = document.getElementById("momentPreview");
        img.src = ev.target.result;
        img.style.display = "block";
        img.style.transform = "translate(-50%, -50%) scale(1)";
    };
    r.readAsDataURL(f);
};
document.getElementById("workImg").onchange = e => {
    let f = e.target.files[0]; if (!f) return;
    let r = new FileReader();
    r.onload = ev => {
        let img = document.getElementById("workPreview");
        img.src = ev.target.result;
        img.style.display = "block";
        img.style.transform = "translate(-50%, -50%) scale(1)";
    };
    r.readAsDataURL(f);
};

// 进度条
function bindPro(inpId,barId){
    let inp=document.getElementById(inpId),bar=document.getElementById(barId);
    inp.oninput=()=>{let v=Math.max(0,Math.min(100,parseInt(inp.value)||0));inp.value=v;bar.style.width=v+"%";};
}
bindPro("bkPercent","bkBar");bindPro("buildPercent","buildBar");bindPro("codePercent","codeBar");

// 清空
function clearAll(){
    document.querySelectorAll("input,textarea").forEach(x=>x.value="");
    document.getElementById("classTime").value=new Date().toISOString().slice(0,16);
    document.getElementById("classScore").value=100;
    ["bkBar","buildBar","codeBar"].forEach(id=>document.getElementById(id).style.width="80%");
    ["bkPercent","buildPercent","codePercent"].forEach(id=>document.getElementById(id).value=80);
    document.getElementById("momentPreview").style.display="none";
    document.getElementById("workPreview").style.display="none";
    document.querySelectorAll(".ability-type-select").forEach(s=>s.selectedIndex=0);
    document.querySelectorAll(".abilityDesc").forEach(d=>d.innerText="请选择能力");
    document.querySelectorAll(".star-input").forEach((inp,i)=>{inp.value=3;document.querySelectorAll(".star-display")[i].innerText="★★★☆☆";});
    typeSel.selectedIndex=0;listSel.innerHTML='<option value="">先选择等级</option>';
}

// ✅ 生成图片（修复完成）
async function generateReport(){
    const container = document.getElementById('report-container');

    const canvas = await html2canvas(container, {
        scale: 2,
        useCORS: true,
        logging: false
    });

    const link = document.createElement('a');
    link.download = '课堂记录反馈.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    alert('报告生成成功！');
}

// 初始化
initImageResize("momentPreview");
initImageResize("workPreview");
</script>
</body>
</html>
